<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Story → Anime Video</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Story → Anime Video</h1>
      <p class="sub">Paste your story or a scene-by-scene script. Free, open-source pipeline — see README for how each stage works.</p>
    </header>

    <section class="card">
      <label for="title">Title</label>
      <input id="title" type="text" placeholder="My Anime Short" />

      <label for="story">Story / scenes</label>
      <textarea id="story" rows="10" placeholder="Scene 1: A young ninja stands on a rooftop at sunset...&#10;&#10;Scene 2: The ninja leaps between buildings chasing a shadowy figure...&#10;&#10;(Separate scenes with a blank line, or just paste your whole story and it'll be split automatically.)"></textarea>

      <div class="row">
        <div>
          <label for="language">Narration language</label>
          <select id="language"></select>
        </div>
        <div>
          <label for="maxScenes">Max scenes</label>
          <input id="maxScenes" type="number" min="1" max="30" value="10" />
        </div>
      </div>

      <button id="generateBtn">Generate video</button>
      <p class="error" id="errorMsg" hidden></p>
    </section>

    <section class="card" id="progressCard" hidden>
      <h2>Generating…</h2>
      <div class="progressbar"><div class="progressbar-fill" id="progressFill"></div></div>
      <p id="stageText">Starting…</p>
      <p class="sceneCount" id="sceneCount"></p>
    </section>

    <section class="card" id="resultCard" hidden>
      <h2>Your video</h2>
      <video id="resultVideo" controls playsinline></video>
      <a id="downloadLink" download="anime_video.mp4">Download MP4</a>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
